
<svg xmlns="http://www.w3.org/2000/svg"
     width="400" height="240"
     viewBox="0 0 400 240">

  <!-- Background -->
  <rect width="400" height="240" fill="#0f172a"/>

  <!-- Title -->
  <text x="200" y="75"
        fill="#38bdf8"
        font-size="28"
        text-anchor="middle">
    TypeScript Counter
  </text>

  <!-- Counter value -->
  <text x="200" y="140"
        fill="white"
        font-size="58"
        text-anchor="middle">
    5
  </text>

  <!-- Increment button -->
  <rect x="135" y="160"
        width="130" height="45"
        rx="8" fill="#38bdf8"/>

  <text x="200" y="189"
        fill="#0f172a"
        font-size="17"
        text-anchor="middle">
    Increment
  </text>

</svg>
