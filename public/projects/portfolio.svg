
<svg xmlns="http://www.w3.org/2000/svg"
     width="400" height="240"
     viewBox="0 0 400 240">

  <!-- Background -->
  <rect width="400" height="240" fill="#0f172a"/>

  <!-- Website preview -->
  <rect x="40" y="40"
        width="320" height="160"
        rx="12" fill="#1e293b"/>

  <!-- Website title -->
  <text x="200" y="90"
        fill="#38bdf8"
        font-size="25"
        text-anchor="middle">
    My Portfolio
  </text>

  <!-- Description -->
  <text x="200" y="128"
        fill="white"
        font-size="18"
        text-anchor="middle">
    Next.js Developer
  </text>

  <!-- Button -->
  <rect x="130" y="147"
        width="140" height="30"
        rx="6" fill="#38bdf8"/>

  <text x="200" y="168"
        fill="#0f172a"
        font-size="14"
        text-anchor="middle">
    View Projects
  </text>

</svg>
